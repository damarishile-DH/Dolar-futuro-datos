name: Actualizar datos

on:
  schedule:
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      desde:
        description: "Cargar historial desde (AAAA-MM-DD). Dejar vacío para el uso diario."
        required: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar script
        run: |
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            python scripts/actualizar.py --desde "${{ github.event.inputs.desde }}"
          else
            python scripts/actualizar.py
          fi
      - name: Guardar cambios
        run: |
          git config user.name "actualizador-datos"
          git config user.email "actions@users.noreply.github.com"
          git add docs/datos.json
          git diff --cached --quiet || git commit -m "Datos al $(date -u +%F)"
          git push
